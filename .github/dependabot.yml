# Dependabot: un seul lockfile (racine, npm workspaces), mises a jour groupees
# pour eviter une PR par paquet transitif.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # Majeures a traiter a la main (migrations)
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # qs suit Express 4 et body-parser, qui n'acceptent que la branche 6.16
      # (override exact dans package.json) : 6.17 et au-dela casseraient l'arbre.
      - dependency-name: "qs"
        versions: [">= 6.17.0"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns:
          - "*"
