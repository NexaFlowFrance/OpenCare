server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    # Same policy as the server's when it serves the client (spaContentSecurityPolicy
    # in server/src/app.ts), except connect-src: the API usually has its own
    # address here (VITE_API_URL, often plain http on a LAN), unknown to this file.
    # script-src 'self' is what matters: no inline script, no javascript: URL.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self' http: https: ws: wss:; font-src 'self' data:; worker-src 'self'; manifest-src 'self'; object-src 'none'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    # The API at the same address as the app. With VITE_API_URL left empty the
    # client calls /api and /ws on its own origin, and they are forwarded to the
    # server (API_UPSTREAM, server:3001 by default). Resolved through Docker's
    # DNS at request time, so nginx starts even before the server is up.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $api_upstream http://${API_UPSTREAM};

    # Behind a reverse proxy on a private network (Traefik, Caddy, a tunnel),
    # take the visitor's address from X-Forwarded-For, so the server's login
    # rate limits count each visitor and not the proxy.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.0/8;
    set_real_ip_from fc00::/7;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # ^~ keeps the static asset rule below from catching API paths such as
    # /api/calendar/feed/<token>.ics.
    location ^~ /api/ {
        # Same limit as the server's JSON body parser (photos travel as data URLs).
        client_max_body_size 8m;
        proxy_read_timeout 300s;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location = /health {
        proxy_pass $api_upstream;
    }

    location = /ws {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 1h;
    }

    # SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Service worker
    location /sw.js {
        add_header Cache-Control "no-cache";
        proxy_cache_bypass $http_pragma;
        proxy_cache_revalidate on;
        expires off;
        access_log off;
    }
}
